<body>
<title>한판 검 강화</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap">
<style>
/* 밤의 대장간: 숯빛 바탕, 쇳물 주황과 금빛. 화면 가운데 모루 위에 뜬 검 하나가 주인공, 아래(넓은 화면은 오른쪽)에 작업대 */
:root{
  --bg:#110d0e; --bg2:#1a1315; --panel:#1f1719; --raise:#2a2023; --line:#3d2f2c;
  --fg:#f5ebdf; --muted:#a8968a; --ember:#ff7a2e; --gold:#ffc95a; --danger:#ff5468; --ok:#73e0a9;
  --display:"Song Myung","Nanum Myeongjo","AppleMyungjo",serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;min-height:520px;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(220px,1fr) auto;gap:10px;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 12px}
.top{display:flex;align-items:center;gap:8px;min-width:0}
.title{font-family:var(--display);font-size:22px;letter-spacing:.02em;color:var(--gold);margin:0;white-space:nowrap;text-shadow:0 0 18px rgba(255,140,40,.35)}
.title small{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-left:4px}
.spacer{flex:1}
.chip{display:flex;align-items:center;gap:5px;background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 7px;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.chip svg{width:16px;height:16px;flex:none}
.chip b{font-weight:400}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);flex:none}
.icon-btn svg{width:17px;height:17px}
.stage{position:relative;border-radius:20px;overflow:hidden;background:var(--bg2);border:1px solid #2a1f1f;min-height:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.splash{position:absolute;left:0;right:0;top:9%;text-align:center;pointer-events:none;opacity:0}
.splash .m{font-family:var(--display);font-size:clamp(30px,7vw,46px);line-height:1.1;color:#fff;text-shadow:0 0 22px var(--sc,#ffb347),0 0 4px var(--sc,#ffb347)}
.splash .s{margin-top:6px;font-size:15px;color:var(--fg);opacity:.9;text-shadow:0 1px 6px #000}
.splash.on{animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.tag-grit{position:absolute;left:12px;top:12px;display:flex;gap:3px;align-items:center;font-size:12px;color:var(--muted);background:rgba(0,0,0,.35);padding:4px 8px;border-radius:999px}
.tag-grit i{width:6px;height:10px;border-radius:3px;background:#3b2c2a;display:block}
.tag-grit i.on{background:var(--ember);box-shadow:0 0 6px var(--ember)}
.panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.plate{display:flex;gap:12px;align-items:center;min-width:0}
.lv{font-family:var(--display);font-size:34px;line-height:1;color:var(--gold);min-width:64px;text-align:center;padding:8px 6px;border:1px solid #5a4330;border-radius:12px;background:linear-gradient(#2b1f1b,#1c1415);font-variant-numeric:tabular-nums}
.pl-txt{min-width:0}
.sname{font-family:var(--display);font-size:22px;line-height:1.2;text-wrap:balance}
.flavor{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stats>div{background:var(--panel);padding:8px 10px;min-width:0}
.stats .k{font-size:11px;color:var(--muted);letter-spacing:.04em}
.stats .v{font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats .v small{font-size:11px;color:var(--ember);margin-left:3px}
.stats .v.bad{color:var(--danger)}
.timing{display:flex;flex-direction:column;gap:5px}
.bar{position:relative;height:40px}
.bar canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.legend{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend>span,#tBreak{white-space:nowrap}
.hold{display:inline-flex;align-items:center;gap:4px;color:#8fc4ff}
.hold svg{width:14px;height:14px}
.hold.bad{color:#ff9a48;animation:nudge2 1s ease-in-out infinite}
.hold.dim{color:var(--muted)}
@keyframes nudge2{50%{opacity:.55}}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.legend .lp{background:linear-gradient(90deg,#ffb347,#ffe08a)}
.legend .lg{background:#a8582a}
.legend .lm{width:3px;border-radius:1px;background:#fff;box-shadow:0 0 6px #fff}
.gauge{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#7a2430;margin-top:5px}
.gauge i{display:block;height:100%}
.gauge .ok{background:var(--ok)}
.gauge .gr{background:var(--ember)}
.stats>div{position:relative}
.boost{position:absolute;right:8px;top:6px;font-size:13px;padding:2px 7px;border-radius:999px;pointer-events:none;opacity:0;font-variant-numeric:tabular-nums}
.boost.on{animation:boost 1.8s ease-out forwards}
@keyframes boost{0%{opacity:0;transform:translateY(10px) scale(.6)}15%{opacity:1;transform:translateY(-4px) scale(1.15)}30%{transform:translateY(0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.tline{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.tline b{color:var(--gold);font-weight:400}
.acts{display:grid;grid-template-columns:1fr 1.9fr 1fr;gap:8px}
.btn{white-space:nowrap;border-radius:14px;background:var(--raise);border:1px solid var(--line);padding:10px 8px;font-size:15px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px}
.btn small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn:disabled{opacity:.38;cursor:default}
.btn.armed{border-color:var(--danger);color:var(--danger)}
.forge{background:linear-gradient(180deg,#ff9a48,#e5531c);border:1px solid #ffb06a;color:#2a0d02;font-family:var(--display);font-size:24px;box-shadow:0 0 24px rgba(255,110,40,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.forge small{color:#4a1c08;font-family:var(--body)}
.forge:not(:disabled):active{transform:translateY(1px)}
.forge:disabled{background:#3a2b28;border-color:var(--line);color:var(--muted);box-shadow:none;opacity:1}
.forge:disabled small{color:var(--muted)}
.forge.rescue{background:linear-gradient(180deg,#9be7c0,#3fae7a);border-color:#b8f5d6;color:#06231a;opacity:1;cursor:pointer}
.tools{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12px;position:relative}
.tool svg{width:20px;height:20px}
.tool .dot{position:absolute;top:6px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 6px var(--ember)}
.tool:disabled{opacity:.4}
@media (min-width:860px){
  .app{grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;min-height:600px}
  .top{grid-column:1/-1}
  .panel{align-self:center}
}
/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(5,3,3,.62);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:540px;max-height:84%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;box-sizing:border-box;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh-h h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0;flex:1;color:var(--gold)}
.note{color:var(--muted);font-size:13px;line-height:1.55;margin:4px 0 10px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-size:15px}
.row .d{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sbtn{border-radius:10px;padding:8px 12px;background:var(--raise);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.sbtn.hot{background:linear-gradient(180deg,#ff9a48,#e5531c);color:#2a0d02;border-color:#ffb06a}
.sbtn:disabled{opacity:.35;cursor:default}
.ic{width:22px;height:22px;flex:none}
.mats{display:flex;flex-wrap:wrap;gap:6px}
.mat{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 5px;border-radius:999px;background:var(--raise);border:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums}
.mat .ic{width:16px;height:16px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.dex button{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:1.3;text-align:center}
.dex button.cur{border-color:var(--gold)}
.dex canvas{width:56px;height:112px}
.dex .nm{min-height:2.6em;color:var(--fg)}
.dex .unk{color:#5c4a46}
.dexinfo{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;line-height:1.5}
.fail-h{font-family:var(--display);font-size:24px;color:var(--danger);margin:2px 0 4px}
.big-acts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.big-acts .sbtn{padding:13px;font-size:15px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.recs div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px}
.recs .k{font-size:11px;color:var(--muted)}
.recs .v{font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px}
.help li{margin:6px 0;line-height:1.55;color:var(--fg)}
.help b{color:var(--gold);font-weight:400}
.inv{background:linear-gradient(180deg,#2c2124,#1a1315);border:2px solid #5a4330;border-radius:14px;padding:10px;box-shadow:inset 0 0 0 1px #0a0606,inset 0 3px 14px rgba(0,0,0,.6),0 0 0 1px #2a1d18}
.inv-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.inv-tabs{display:flex;gap:4px;flex:1}
.inv-tab{padding:7px 14px;border-radius:9px 9px 3px 3px;background:#1a1214;border:1px solid #3a2c2a;border-bottom-width:2px;font-size:13px;color:var(--muted)}
.inv-tab.on{background:linear-gradient(#4a3424,#2c1f18);border-color:#8a6236;color:var(--gold)}
.inv-cap{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:1;border-radius:9px;background:radial-gradient(circle at 50% 40%,#2a1f22,#120c0e);border:2px solid #3a2c2a;position:relative;display:grid;place-items:center;box-shadow:inset 0 2px 8px rgba(0,0,0,.75);padding:0;min-width:0}
.slot>canvas,.slot>svg{width:82%;height:82%;pointer-events:none}
.slot.empty{cursor:default;background:#140e10;border-style:dashed;border-color:#2a2022}
.slot.zero>svg{filter:grayscale(1) brightness(.45)}
.slot.r1{border-color:#3d7bd6;box-shadow:inset 0 0 12px rgba(61,123,214,.45),inset 0 2px 8px rgba(0,0,0,.7)}
.slot.r2{border-color:#9b5cff;box-shadow:inset 0 0 14px rgba(155,92,255,.5),inset 0 2px 8px rgba(0,0,0,.7)}
.slot.r3{border-color:#ffc95a;box-shadow:inset 0 0 16px rgba(255,201,90,.5),0 0 8px rgba(255,201,90,.35)}
.slot.r4{border-color:#ff4d6a;box-shadow:inset 0 0 16px rgba(255,77,106,.55),0 0 10px rgba(255,77,106,.4)}
.slot.sel{outline:2px solid #fff;outline-offset:1px;transform:scale(1.04)}
.slot .cnt{position:absolute;right:4px;bottom:1px;font-size:13px;font-variant-numeric:tabular-nums;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000}
.slot .lvb{position:absolute;left:4px;top:2px;font-size:11px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.slot.new::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 6px var(--ember)}
.idet{display:flex;gap:12px;align-items:flex-start;margin-top:10px;padding:10px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid #3a2c2a;min-height:84px}
.idet .slot{width:72px;flex:none;transform:none;outline:0}
.idet .tx{flex:1;min-width:0;font-size:13px;line-height:1.5}
.idet .nm{font-family:var(--display);font-size:18px;line-height:1.25}
.idet .rar{font-size:11px;letter-spacing:.06em}
.idet .ds{color:var(--muted);margin-top:3px}
.idet .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rc0{color:#a8968a}.rc1{color:#6fa8ff}.rc2{color:#b98aff}.rc3{color:#ffc95a}.rc4{color:#ff6b84}
.btn.nudge{border-color:var(--gold);color:var(--gold);animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{box-shadow:0 0 16px rgba(255,201,90,.55)}}
.rk-me{background:linear-gradient(180deg,#2c2124,#1f1719);border:1px solid #5a4330;border-radius:12px;padding:12px;margin-bottom:10px}
.rk-me .big{font-family:var(--display);font-size:20px;color:var(--gold)}
.rk-row{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.rk-row:first-child{border-top:0}
.rk-row .pl{font-family:var(--display);font-size:17px;text-align:center;color:var(--muted)}
.rk-row.top .pl{color:var(--gold)}
.rk-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-row .sc{text-align:right}
.rk-row .sc small{display:block;font-size:11px;color:var(--muted)}
.rk-row.me{background:rgba(255,201,90,.08);border-radius:8px}
.field{display:flex;gap:6px;margin-top:8px}
.field input,.fb textarea,.fb input{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px;font:inherit;font-size:15px}
.fb textarea{width:100%;box-sizing:border-box;min-height:110px;resize:vertical}
.fb label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-top:8px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button{flex:1;padding:9px;border-radius:10px;background:var(--bg2);border:1px solid var(--line);font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:linear-gradient(#4a3424,#2c1f18);border-color:#8a6236;color:var(--gold)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2e2224;border:1px solid var(--line);padding:10px 16px;border-radius:999px;z-index:40;font-size:14px;max-width:calc(100% - 40px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:up .2s}
.ending{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(255,160,60,.18),rgba(10,6,6,.82));padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.ending .card{max-width:420px;width:100%;text-align:center;background:rgba(31,23,25,.92);border:1px solid #6a4a2a;border-radius:20px;padding:22px 18px}
.ending h2{font-family:var(--display);font-weight:400;font-size:30px;color:var(--gold);margin:4px 0 6px;text-shadow:0 0 18px rgba(255,180,60,.6)}
@media (prefers-reduced-motion:reduce){.splash.on{animation-duration:1.2s}.sheet{animation:none}}
</style>

<div class="app">
  <header class="top">
    <h1 class="title">한판 검 강화</h1>
    <span class="spacer"></span>
    <div class="chip" id="cMoney" title=""><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#ffc95a" stroke="#9a6a1a" stroke-width="1.5"/><path d="M6.5 7.5 8 13l2-4 2 4 1.5-5.5" fill="none" stroke="#7a4a0a" stroke-width="1.4" stroke-linejoin="round"/></svg><b id="vMoney">0원</b></div>
    <div class="chip" title="깨짐 방지권"><svg viewBox="0 0 20 20"><path d="M10 2 3.5 4.5v5c0 4 3 7 6.5 8.5 3.5-1.5 6.5-4.5 6.5-8.5v-5Z" fill="#6fb6ff" stroke="#1e4f86" stroke-width="1.3"/><path d="M7 10l2 2 4-4" fill="none" stroke="#0b2440" stroke-width="1.6"/></svg><b id="vProt">0</b></div>
    <button class="icon-btn" id="bSound" aria-label="소리 켜고 끄기"></button>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="tag-grit" id="grit" hidden title="집념: 부서질 때마다 다음 성공까지 +0.5%p"><span>집념</span><span id="gritBar" style="display:flex;gap:2px"></span></div>
    <div class="splash" id="splash"><div class="m"></div><div class="s"></div></div>
  </main>

  <section class="panel">

const SERVER="https://sword-master.2juwon.workers.dev";
const PAGES_URL='https://2juwon.github.io/sword-master/';
async function api(path,body){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000);
  try{const r=await fetch(SERVER+path,body?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),signal:ctl.signal}:{signal:ctl.signal});const j=await r.json().catch(()=>({}));if(!r.ok&&!j.error)j.error='서버가 응답하지 않아요 ('+r.status+')';return j}
  catch(e){return{error:'서버에 연결하지 못했어요'}}finally{clearTimeout(tm)}
}
let runBusy=false;
async function startRun(){if(!SERVER||S.run||runBusy)return;runBusy=true;const r=await api('/api/run/start',{});runBusy=false;if(r.run){S.run={id:r.run,token:r.token,at:r.at};S.rankBest=0;S.rname='';save();syncBest()}}
let bestBusy=false;
async function syncBest(){
  if(!SERVER||!S.run||bestBusy||S.tier<=(S.rankBest||0)||S.tier>=MAX)return;
  bestBusy=true;const t=S.tier;
  const r=await api('/api/run/best',{run:S.run.id,token:S.run.token,tier:t,attempts:S.attempts});
  bestBusy=false;
  if(r.ok){S.rankBest=Math.max(S.rankBest||0,r.best||t);if(r.place)S.rankPlace=r.place;save();
    if(t>=10&&!S.rname&&!S.namePrompted){S.namePrompted=1;save();toast('+'+t+' 달성! 랭킹에 이름을 올려 보세요')}}
}
async function clearRun(){
  if(!SERVER||!S.run)return null;
  const r=await api('/api/run/clear',{run:S.run.id,token:S.run.token,attempts:S.attempts,breaks:S.breaks});
  if(r.ok){S.clearMs=r.ms;S.rankBest=MAX;save()}
  return r;
}
function fmtMs(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60);return h?`${h}시간 ${m%60}분`:`${m}분 ${Math.floor(ms/1000)%60}초`}

}

function drawBg(c,g,v,t){

function ring(c,g,v,t,front){

    const cy=g.gy-g.len*(r?.72:.42),rx=g.size*(r?.22:.3),ry=g.size*.06,n=r?9:14,sp=r?-1.4:1;

}
function drawParticles(c,dt){
  c.save();

    const p=P[i];p.life-=dt;if(p.life<=0){P.splice(i,1);continue}
    p.max=p.max||p.life+dt;const f=p.life/p.max;
    if(p.k==='wisp'||p.k==='arc'){p.a+=p.va*dt;if(p.vr)p.r=Math.max(2,p.r+p.vr*dt);p.x=p.ox+Math.cos(p.a)*p.r;p.y=p.oy+Math.sin(p.a)*p.r*.45}

      case'flake':{c.lineWidth=1;c.save();c.translate(p.x,p.y);c.rotate(p.rot+=dt);c.beginPath();for(let j=0;j<3;j++){const a=j*Math.PI/3;c.moveTo(-Math.cos(a)*p.sz,-Math.sin(a)*p.sz);c.lineTo(Math.cos(a)*p.sz,Math.sin(a)*p.sz)}c.stroke();c.restore();break}
      case'glyph':{c.lineWidth=1.4;c.shadowColor=p.c;c.shadowBlur=6;c.beginPath();for(const s of p.segs){c.moveTo(p.x+Math.cos(s[0])*p.sz,p.y+Math.sin(s[0])*p.sz);c.lineTo(p.x+Math.cos(s[1])*p.sz,p.y+Math.sin(s[1])*p.sz)}c.stroke();c.shadowBlur=0;break}
      case'drop':c.beginPath();c.ellipse(p.x,p.y,p.sz*.7,p.sz*1.5,0,0,7);c.fill();break;
      case'wisp':c.beginPath();c.arc(p.x,p.y,p.sz*(.5+f),0,7);c.fill();break;
      case'arc':{const cy=p.oy;c.lineWidth=1.6;c.beginPath();c.ellipse(p.ox,cy,p.r,p.r*.45,0,p.a-.9,p.a);c.stroke();break}
      case'conf':c.save();c.translate(p.x,p.y);c.rotate(p.rot+=p.vr*dt);c.fillRect(-p.sz/2,-p.sz/4,p.sz,p.sz/2);c.restore();break;
      case'bolt':c.lineWidth=2;c.shadowColor=p.c;c.shadowBlur=14;c.beginPath();c.moveTo(p.pts[0][0],p.pts[0][1]);for(const q of p.pts)c.lineTo(q[0],q[1]);c.stroke();c.lineWidth=.8;c.strokeStyle='#fff';c.stroke();c.shadowBlur=0;break;
      case'ring':{const r=p.r0+(1-f)*p.r1;c.lineWidth=p.sz*f+1;c.beginPath();c.arc(p.x,p.y,r,0,7);c.stroke();break}
    }
  }
  c.restore();
}

/* 깨짐: 지금 검을 그림으로 떠서 삼각형 조각으로 나눔 */
function shatter(g,tier,t){
  const buf=document.createElement('canvas');buf.width=cv.width;buf.height=cv.height;
  const b=buf.getContext('2d');b.setTransform(DPR,0,0,DPR,0,0);drawSword(b,tier,g.cx,g.cy,g.size,t,{crack:1,still:1});
  const x0=g.cx-g.size*.3,x1=g.cx+g.size*.3,y0=g.gy-g.len-8,y1=g.gy+g.grip+g.size*.05,cols=4,rows=11;
  const grid=[];for(let r=0;r<=rows;r++){grid[r]=[];for(let c2=0;c2<=cols;c2++){const ed=r===0||r===rows||c2===0||c2===cols;grid[r][c2]=[x0+(x1-x0)*c2/cols+(ed?0:rnd(-.3,.3)*(x1-x0)/cols),y0+(y1-y0)*r/rows+(ed?0:rnd(-.3,.3)*(y1-y0)/rows)]}}
  shards=[];
  for(let r=0;r<rows;r++)for(let c2=0;c2<cols;c2++){
    const a=grid[r][c2],b2=grid[r][c2+1],cc=grid[r+1][c2+1],d=grid[r+1][c2];
    for(const tri of[[a,b2,cc],[a,cc,d]]){const mx=(tri[0][0]+tri[1][0]+tri[2][0])/3,my=(tri[0][1]+tri[1][1]+tri[2][1])/3;
      shards.push({tri,mx,my,x:0,y:0,vx:(mx-g.cx)*rnd(3,7)+rnd(-60,60),vy:rnd(-260,-40)+(my-g.gy)*.6,rot:0,vr:rnd(-7,7),life:1.6})}
  }
  shards.buf=buf;
}
function drawShards(c,dt){
  if(!shards.length)return;
  for(const s of shards){s.vy+=900*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.rot+=s.vr*dt;s.life-=dt}
  shards=Object.assign(shards.filter(s=>s.life>0),{buf:shards.buf});
  for(const s of shards){
    c.save();c.globalAlpha=Math.min(1,s.life/.5);
    c.translate(s.mx+s.x,s.my+s.y);c.rotate(s.rot);c.translate(-s.mx,-s.my);
    c.beginPath();c.moveTo(s.tri[0][0],s.tri[0][1]);c.lineTo(s.tri[1][0],s.tri[1][1]);c.lineTo(s.tri[2][0],s.tri[2][1]);c.closePath();c.clip();
    c.drawImage(shards.buf,0,0,W,H);c.restore();
  }
}
function drawHammer(c,g,ang){
  const ix=g.cx+g.hw*1.05,iy=g.gy-g.len*.38,px=ix+g.size*.36,py=iy+g.size*.1;
  const base=Math.atan2(iy-py,ix-px),Lh=Math.hypot(ix-px,iy-py),hw2=g.size*.07,hh=g.size*.1;
  c.save();c.translate(px,py);c.rotate(base+ang);
  c.fillStyle='#5a3a22';rr(c,0,-g.size*.012,Lh-hw2*.2,g.size*.024,4);c.fill();
  c.translate(Lh,0);
  const lg=c.createLinearGradient(0,-hh/2,0,hh/2);lg.addColorStop(0,'#7a7074');lg.addColorStop(.5,'#3a3236');lg.addColorStop(1,'#1e181b');
  c.fillStyle=lg;rr(c,0,-hh/2,hw2,hh,3);c.fill();c.fillStyle='rgba(255,200,150,.35)';c.fillRect(0,-hh/2,2,hh);
  c.restore();

/* ───── 루프 ───── */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;nowT+=dt;const t=nowT;
  const L=layout(),v=V[S.tier];
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const g=geom(v,L.cx,L.cy,L.size);
  // 흔들림·튀어오름
  shake=Math.max(0,shake-dt*3);popV+=((1-pop)*170-popV*14)*dt;pop+=popV*dt;
  const sx=RM?0:(Math.random()-.5)*shake*14,sy=RM?0:(Math.random()-.5)*shake*14;
  ctx.save();ctx.translate(sx,sy);
  drawBg(ctx,g,v,t);
  const bob=Math.sin(t*1.4)*g.size*.008;
  if(!hidden){

let fbKind='idea';
function openFeedback(){
  if(!SERVER){sheet('의견 보내기',`<p class="note">의견 보내기는 GitHub 버전에서 돼요.</p><div class="big-acts"><a class="sbtn hot" style="text-align:center;text-decoration:none" href="${PAGES_URL}" target="_blank" rel="noopener">${PAGES_URL.replace('https://','')} 열기</a></div>`);return}
  const h=`<div class="fb"><div class="seg"><button data-k="idea" aria-pressed="${fbKind==='idea'}">의견·아이디어</button><button data-k="bug" aria-pressed="${fbKind==='bug'}">고장 신고</button></div>
  <textarea id="fbText" maxlength="2000" placeholder="${fbKind==='bug'?'어떤 화면에서 무엇을 눌렀을 때 어떻게 됐는지 적어 주세요':'바라는 점, 재밌었던 점, 아쉬운 점을 적어 주세요'}"></textarea>
  <input id="fbContact" maxlength="100" placeholder="답장 받을 연락처 (적지 않아도 돼요)" style="width:100%;box-sizing:border-box;margin-top:8px">
  <label><input type="checkbox" id="fbCtx" ${fbKind==='bug'?'checked':''}> 지금 게임 상황(단계·돈·재료) 같이 보내기</label>
  <div class="big-acts"><button class="sbtn hot" id="fbGo">보내기</button></div></div>`;
  sheet('의견 보내기',h);
  $('#shB').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const t=$('#fbText').value;fbKind=b.dataset.k;openFeedback();$('#fbText').value=t});
  $('#fbGo').onclick=async()=>{const text=$('#fbText').value.trim();if(!text){toast('내용을 적어 주세요');return}
    const b=$('#fbGo');b.disabled=true;b.textContent='보내는 중…';
    const ctx=$('#fbCtx').checked?{tier:S.tier,money:S.money,prot:S.prot,items:S.items,store:S.store,attempts:S.attempts,breaks:S.breaks,best:S.best,crack:!!S.crack,grit:S.grit,screen:innerWidth+'x'+innerHeight}:null;
    const r=await api('/api/feedback',{kind:fbKind,text,contact:$('#fbContact').value.trim(),context:ctx});
    if(r.ok){closeSheet();toast('보냈어요. 고마워요!')}else{toast(r.error);b.disabled=false;b.textContent='보내기'}};
}
function ending(cr){
  SFX.fanfare();
  const sec=Math.round((S.cleared.at-S.start)/1000),hh=Math.floor(sec/3600),mm=Math.floor(sec%3600/60);
  const d=document.createElement('div');d.className='ending';
  d.innerHTML=`<div class="card"><div style="color:var(--muted);font-size:13px;letter-spacing:.1em">+29 · 강화 끝</div><h2>태초의 불꽃검</h2><p class="note" style="text-align:center">${S.cleared.attempts.toLocaleString()}번 두드려 완성했어요${sec>60?` · ${hh?hh+'시간 ':''}${mm}분`:''}<br>부서진 검 ${S.breaks.toLocaleString()}자루를 딛고 올라왔어요.</p><div id="eRank"></div><div class="big-acts"><button class="sbtn hot" id="eOk">검 감상하기</button></div></div>`;
  document.body.appendChild(d);
  if(cr)cr.then(r=>{const el=d.querySelector('#eRank');if(!el||!r)return;
    if(r.error){el.innerHTML=`<p class="note" style="text-align:center">${esc(r.error)}</p>`;return}
    el.innerHTML=`<p class="note" style="text-align:center;color:var(--fg)">클리어 시간 <b style="color:var(--gold);font-weight:400">${fmtMs(r.ms)}</b>${r.place?` · 클리어 랭킹 ${r.place}위${r.named?'':' 예상'}`:''}</p>`+(r.named?'':`<div class="field"><input id="eName" maxlength="8" placeholder="랭킹에 올릴 이름 (8자)"><button class="sbtn hot" id="eGo">올리기</button></div>`);
    const go=d.querySelector('#eGo');if(go)go.onclick=async()=>{const x=await setRankName(d.querySelector('#eName').value);if(x.ok){el.innerHTML=`<p class="note" style="text-align:center;color:var(--gold)">${esc(x.name)} · 클리어 랭킹 ${x.clearPlace||'100위 밖'}${x.clearPlace?'위':''}</p>`}else toast(x.error)}})
  const fw=setInterval(()=>{if(!document.body.contains(d)){clearInterval(fw);return}burst(rnd(W*.15,W*.85),rnd(H*.1,H*.5),40,[hueC(nowT,rnd(0,360),65),'#fff'],.7)},500);
  d.querySelector('#eOk').onclick=()=>d.remove();
}

/* ───── 연결 ───── */
$('#bForge').onclick=forge;$('#bSell').onclick=sell;$('#bStore').onclick=store;
$('#tShop').onclick=openShop;$('#tCraft').onclick=openCraft;$('#tBag').onclick=openBag;$('#tDex').onclick=()=>openDex();$('#tMore').onclick=openMore;$('#tRank').onclick=openRank;
$('#bSound').onclick=()=>{S.sound=!S.sound;soundIcon();save();if(S.sound)SFX.coin()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeSheet();return}
  if(sheetOpen||e.target.closest&&e.target.closest('input,textarea'))return;
  if(e.code==='Space'||e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&e.key==='Enter')return;e.preventDefault();forge()}
  if(e.key==='s'||e.key==='S')sell();
});
cv.addEventListener('pointerdown',()=>{if(!sheetOpen)forge()});
if(S.tier===MAX&&!S.dex[MAX])S.dex[MAX]=1;
soundIcon();ui();startRun();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
</script>

</body>
</html>
